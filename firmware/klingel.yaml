# Tuerklingel Haustuer → Home Assistant (nur mithoeren, der Gong klingelt unveraendert weiter)
# Hardware: Wemos D1 mini V3.0.0 (ESP8266), 3 Taster an der klassischen Anlage
# Versorgung: USB-Netzteil an der Schuko-Steckdose im linken Verteiler (NICHT aus dem Klingeltrafo, Hager ST303 hat nur 8 VA)
# Abgriff: Abzweigdose oben links ueber dem linken Verteiler (alle Etagenadern + Gong-Rueckleiter, nur Kleinspannung)
# Je Etage ein PC817C + 1N4007 antiparallel (Ring an Pin 1) + 1 kΩ vor Pin 1:
#     Etagenader → 1 kΩ → Pin 1 (Anode), Pin 2 (Kathode) → Gong-Rueckleiter (grau)
#     Pin 4 (Kollektor) → D5 / D6 / D7, Pin 3 (Emitter) → G; interner Pull-up, keine externen Widerstaende
#     Erdgeschoss → D5 (GPIO14, gelb), Etage 1 → D6 (GPIO12, gruen), Etage 2 → D7 (GPIO13, blau), G schwarz
#     (D3/D4/D8 sind Boot-Pins, D1/D2 bleiben fuer das optionale Relais frei)
#   Nur eine Halbwelle schaltet (50 Pulse/s) — das glaetten die Filter unten.
# Tischtest 11.10.2026 mit 18650-Zelle bestanden (alle 3 Kanaele, kein Uebersprechen).
# Stand 11.10.2026 — Notiz project_ha_klingel

substitutions:
  name: klingel
  friendly_name: Klingel
  # --- ein Taster je Etage; Namen ergeben event.klingel_erdgeschoss / _etage_1 / _etage_2 ---
  taster_1: Erdgeschoss
  taster_2: Etage 1
  taster_3: Etage 2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Tuerklingel Haustuer (Optokoppler am Gong)

esp8266:
  board: d1_mini

logger:
  level: INFO

api:
  encryption:
    key: !secret klingel_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Klingel-Fallback
    password: !secret klingel_ap_password

captive_portal:

event:
  - platform: template
    id: event_1
    name: ${taster_1}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]
  - platform: template
    id: event_2
    name: ${taster_2}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]
  - platform: template
    id: event_3
    name: ${taster_3}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]

binary_sensor:
  - platform: gpio
    id: taster_1
    name: ${taster_1} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO14, mode: INPUT_PULLUP, inverted: true }   # D5
    filters: &klingelfilter
      # Reihenfolge wichtig (11.10.): PC817 + Gegendiode liefert bei 50 Hz nur ~10 ms EIN je 20 ms.
      # delayed_on zuerst haette jedes EIN verworfen (AUS kommt vor Ablauf) → nie ein Druck erkannt.
      # delayed_off verlaengert jedes EIN um 200 ms – auch eine Stoerspitze. Daher delayed_on = 200 + 30 ms:
      # Spitzen < 30 ms bleiben verworfen, ein echter Druck meldet sich nach ~0,23 s.
      - delayed_off: 200ms    # erst Halbwellen-Luecken (≤ 10–20 ms) zu Dauer-EIN glaetten
      - delayed_on: 230ms     # dann alles verwerfen, was vor der Glaettung kuerzer als ~30 ms war
    on_press:
      - event.trigger: { id: event_1, event_type: gedrueckt }
  - platform: gpio
    id: taster_2
    name: ${taster_2} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO12, mode: INPUT_PULLUP, inverted: true }   # D6
    filters: *klingelfilter
    on_press:
      - event.trigger: { id: event_2, event_type: gedrueckt }
  - platform: gpio
    id: taster_3
    name: ${taster_3} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO13, mode: INPUT_PULLUP, inverted: true }   # D7
    filters: *klingelfilter
    on_press:
      - event.trigger: { id: event_3, event_type: gedrueckt }

  - platform: status
    name: Status

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 120s
  - platform: uptime
    name: Laufzeit
    update_interval: 600s

# --- optional spaeter: Gong nachts stumm schalten ---------------------------------
