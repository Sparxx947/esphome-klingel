# Tuerklingel Haustuer → Home Assistant (nur mithoeren, der Gong klingelt unveraendert weiter)
# Hardware: Wemos D1 mini V3.0.0 (ESP8266), 3 Taster an der klassischen Anlage
# Versorgung OHNE Steckdose aus dem Klingeltrafo (Kleinspannung, keine 230-V-Arbeit):
#   Trafo 8–12 V AC → Brueckengleichrichter (z. B. DB107/MB10S) → Elko 1000 µF/35 V
#   → Step-down-Modul (MP1584 o. ae., VORHER auf 5,0 V einstellen!) → 5V-Pin + G des D1 mini
#   D1 zieht ~80 mA, Spitzen ~350 mA beim Senden; Trafo-Leistungsschild pruefen (Dauerbetrieb, ≥ 1 A)
# Je Taster ein Optokoppler PC814 (AC-Eingang, zwei antiparallele LEDs → beide Halbwellen)
#     Eingang: parallel zum Gong (bzw. Gong-Eingang) dieses Tasters, in Reihe 1 kΩ (0,5 W)
#       Klingeltrafo 8–12 V AC → Spitze ~11–17 V → ~10–16 mA, PC814 vertraegt 50 mA
#       (bei 230-V-Gong NICHT verwenden — andere Schaltung noetig)
#     Ausgang: Kollektor (Pin 4) → D5 / D6 / D7, Emitter (Pin 3) → G; interner Pull-up
#     Taster 1 → D5 (GPIO14), Taster 2 → D6 (GPIO12), Taster 3 → D7 (GPIO13)
#     (D3/D4/D8 sind Boot-Pins, D1/D2 bleiben fuer das optionale Relais frei)
#   Taster gedrueckt → Gong hat Spannung → Optokoppler zieht seinen Eingang auf GND
#   Alternativ PC817: dann 1N4148 antiparallel zur LED, sonst sperrt die negative Halbwelle die LED
#   (die Wechselspannung liefert so nur 50 Pulse/s — das glaettet delayed_off unten).
# Stand 04.10.2026 — Notiz project_ha_klingel

substitutions:
  name: klingel
  friendly_name: Klingel
  # --- ein Taster je Etage; Namen ergeben event.klingel_erdgeschoss / _etage_1 / _etage_2 ---
  taster_1: Erdgeschoss
  taster_2: Etage 1
  taster_3: Etage 2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Tuerklingel Haustuer (Optokoppler am Gong)

esp8266:
  board: d1_mini

logger:
  level: INFO

api:
  encryption:
    key: !secret klingel_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Klingel-Fallback
    password: !secret klingel_ap_password

captive_portal:

event:
  - platform: template
    id: event_1
    name: ${taster_1}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]
  - platform: template
    id: event_2
    name: ${taster_2}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]
  - platform: template
    id: event_3
    name: ${taster_3}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]

binary_sensor:
  - platform: gpio
    id: taster_1
    name: ${taster_1} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO14, mode: INPUT_PULLUP, inverted: true }   # D5
    filters: &klingelfilter
      - delayed_on: 30ms      # Stoerspitzen auf der Klingelleitung verwerfen
      - delayed_off: 200ms    # Nulldurchgaenge der Wechselspannung (10–20 ms) ueberbruecken
    on_press:
      - event.trigger: { id: event_1, event_type: gedrueckt }
  - platform: gpio
    id: taster_2
    name: ${taster_2} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO12, mode: INPUT_PULLUP, inverted: true }   # D6
    filters: *klingelfilter
    on_press:
      - event.trigger: { id: event_2, event_type: gedrueckt }
  - platform: gpio
    id: taster_3
    name: ${taster_3} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO13, mode: INPUT_PULLUP, inverted: true }   # D7
    filters: *klingelfilter
    on_press:
      - event.trigger: { id: event_3, event_type: gedrueckt }

  - platform: status
    name: Status

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 120s
  - platform: uptime
    name: Laufzeit
    update_interval: 600s

# --- optional spaeter: Gong nachts stumm schalten ---------------------------------
