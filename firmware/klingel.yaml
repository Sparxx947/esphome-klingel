# Tuerklingel Haustuer → Home Assistant (nur mithoeren, der Gong klingelt unveraendert weiter)
# Hardware: Wemos D1 mini V3.0.0 (ESP8266), 3 Taster an der klassischen Anlage
# Versorgung: USB-Netzteil an der Schuko-Steckdose im linken Verteiler (NICHT aus dem Klingeltrafo, Hager ST303 hat nur 8 VA)
# Abgriff: Abzweigdose oben links ueber dem linken Verteiler (alle Etagenadern + Gong-Rueckleiter, nur Kleinspannung)
# Seit 20.10.2026 je Etage ein BC517 (Darlington) + 9,1 MΩ (Batteriegongs mit Kontakteingang, Schleife Kl.1 ↔ Kl.2):
#     Kl.1 (Plus der Gong-Batterie) → 9,1 MΩ → Basis, Emitter → G = grau (alle Kl.2), Kollektor → D5 / D6 / D7 (Pull-up)
#     Ruhe: Schleifenspannung liegt an → BC517 leitet → Pin LOW.  Taster schliesst die Schleife kurz → Pin HIGH.
#     Erdgeschoss → D5 (GPIO14, gelb), Etage 1 → D6 (GPIO12, gruen), Etage 2 → D7 (GPIO13, blau), G schwarz
#     (D3/D4/D8 sind Boot-Pins, D1/D2 bleiben fuer das optionale Relais frei)
#     Dauer-HIGH = Schleife ohne Spannung (Gong-Batterie leer, Ader lose) → Sensor "Klingelbatterie leer"
#     Plan: plaene/klingel-platine-bc517.pdf
# Stand 20.10.2026 (vorher PC817-Optokoppler, Tischtest 11.10.) — Notiz project_ha_klingel

substitutions:
  name: klingel
  friendly_name: Klingel
  # --- ein Taster je Etage; Namen ergeben event.klingel_erdgeschoss / _etage_1 / _etage_2 ---
  taster_1: Erdgeschoss
  taster_2: Etage 1
  taster_3: Etage 2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Tuerklingel Haustuer (BC517 an den Gong-Schleifen)

esp8266:
  board: d1_mini

logger:
  level: INFO

api:
  encryption:
    key: !secret klingel_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Klingel-Fallback
    password: !secret klingel_ap_password

captive_portal:

event:
  - platform: template
    id: event_1
    name: ${taster_1}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]
  - platform: template
    id: event_2
    name: ${taster_2}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]
  - platform: template
    id: event_3
    name: ${taster_3}
    icon: mdi:doorbell
    device_class: doorbell
    event_types: [gedrueckt]

binary_sensor:
  - platform: gpio
    id: taster_1
    name: ${taster_1} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO14, mode: INPUT_PULLUP, inverted: false }   # D5
    filters: &klingelfilter
      # Gleichspannung, keine Halbwellen mehr — nur Tasterprellen und Stoerspitzen verwerfen
      - delayed_on: 30ms
      - delayed_off: 100ms
    on_press:
      - event.trigger: { id: event_1, event_type: gedrueckt }
  - platform: gpio
    id: taster_2
    name: ${taster_2} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO12, mode: INPUT_PULLUP, inverted: false }   # D6
    filters: *klingelfilter
    on_press:
      - event.trigger: { id: event_2, event_type: gedrueckt }
  - platform: gpio
    id: taster_3
    name: ${taster_3} gedrückt
    icon: mdi:doorbell
    pin: { number: GPIO13, mode: INPUT_PULLUP, inverted: false }   # D7
    filters: *klingelfilter
    on_press:
      - event.trigger: { id: event_3, event_type: gedrueckt }

  - platform: status
    name: Status

  # Ein Kanal laenger als 30 s "gedrueckt" = Schleife ohne Spannung (Batterie leer / Ader lose), kein Besucher
  - platform: template
    name: Klingelbatterie leer
    device_class: problem
    lambda: return id(taster_1).state || id(taster_2).state || id(taster_3).state;
    filters:
      - delayed_on: 30s

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 120s
  - platform: uptime
    name: Laufzeit
    update_interval: 600s

